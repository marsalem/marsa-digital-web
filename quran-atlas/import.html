<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quran Atlas — Shared Content</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #EAF1F8; color: #10243D; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .card { background: white; border-radius: 24px; padding: 40px 32px; max-width: 480px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.1); text-align: center; }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; color: #10243D; }
    .subtitle { font-size: 1rem; color: #5A6A7A; margin-bottom: 24px; }
    .item-box { background: #EAF1F8; border-radius: 16px; padding: 20px; margin-bottom: 24px; border-left: 4px solid #326499; text-align: left; }
    .item-name { font-size: 1.2rem; font-weight: 700; color: #326499; margin-bottom: 4px; }
    .item-meta { font-size: 0.9rem; color: #7E97AF; }
    .btn { display: block; background: #326499; color: white; padding: 16px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 1rem; margin-bottom: 12px; }
    .btn:hover { background: #2a5580; }
    .btn-secondary { display: block; background: #EAF1F8; color: #326499; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    .error { color: #E07B4F; font-size: 0.95rem; margin-top: 16px; }
    footer { margin-top: 32px; color: #8FA8BD; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌙</div>
    <h1>Quran Atlas</h1>
    <p class="subtitle" id="subtitle">Someone shared something with you</p>

    <div class="item-box" id="item-box" style="display:none">
      <div class="item-name" id="item-name">Loading...</div>
      <div class="item-meta" id="item-meta"></div>
    </div>

    <a class="btn" id="open-app" href="#" style="display:none">Open in Quran Atlas</a>
    <a class="btn" id="download-btn" href="https://apps.apple.com/app/id6781110875" style="display:none">Download Quran Atlas</a>
    <a class="btn-secondary" href="/quran-atlas">Learn More About Quran Atlas</a>

    <p class="error" id="error" style="display:none">Could not read the shared content. The link may be invalid or expired.</p>
  </div>

  <footer>© 2026 Marsa Digital</footer>

  <script>
    // Share Service — this URL carries only a short share ID, never the
    // shared content itself, regardless of whether it's 1 reference card
    // or a large topic tree: /api/share/:id (Vercel serverless function,
    // ../api/share/[id].js) fetches the actual payload from Upstash
    // Redis (marsa-digital-web's own Share Service — see that repo's
    // lib/shareService.js for the full design). This is deliberate and
    // uniform — no separate "small payload -> URL-embedded" path exists
    // or should be reintroduced.
    //
    // PRIVACY: a share ID is an unguessable link, not an authenticated
    // credential — anyone who has this URL can view what it points to
    // until it expires (1 year by default). There's no login/access
    // list. Same model as an "anyone with the link can view" Google
    // Docs/Notion share. Don't add copy to this page that implies
    // stronger privacy than that.
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (id) {
      fetch(`/api/share/${encodeURIComponent(id)}`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(payload => {
          // Two payload shapes share this one page/deep-link receiver: a
          // wrapped {type:"qatlas_playlist", playlist} envelope (Playlist
          // Share's own generator, buildPlaylistShareLink in the app's
          // utils/sharing.ts), or a bare Topic Node (legacy shape, still
          // used for Topic sharing today — no `type` field at all).
          if (payload && payload.type === 'qatlas_playlist' && payload.playlist) {
            showPlaylist(payload.playlist);
          } else {
            showTopic(payload);
          }

          // Deep link to app — quranatlas://import?id=... carries the
          // SAME short id, not the fetched payload. The app's own
          // handleUrl fetches /api/share/:id itself rather than trusting
          // whatever this page already fetched, for the same "URL only
          // ever carries an id" uniformity — see index.tsx's own comment
          // on this branch.
          const deepLink = `quranatlas://import?id=${encodeURIComponent(id)}`;
          const openBtn = document.getElementById('open-app');
          openBtn.href = deepLink;
          openBtn.style.display = 'block';

          // Show download button
          document.getElementById('download-btn').style.display = 'block';

          // Try to open app automatically
          window.location.href = deepLink;
        })
        .catch(() => {
          document.getElementById('error').style.display = 'block';
          document.getElementById('download-btn').style.display = 'block';
        });
    } else {
      document.getElementById('error').style.display = 'block';
    }

    function showTopic(topic) {
      document.getElementById('subtitle').textContent = 'Someone shared a Quran topic with you';
      document.getElementById('item-name').textContent = topic.name || 'Shared Topic';
      const subCount = (topic.children || []).length;
      const verseCount = countVerses(topic);
      document.getElementById('item-meta').textContent =
        `${subCount} subtopic${subCount !== 1 ? 's' : ''} · ${verseCount} verse${verseCount !== 1 ? 's' : ''}`;
      document.getElementById('item-box').style.display = 'block';
    }

    function showPlaylist(playlist) {
      document.getElementById('subtitle').textContent = 'Someone shared a Quran playlist with you';
      document.getElementById('item-name').textContent = playlist.name || 'Shared Playlist';
      const count = (playlist.items || []).length;
      document.getElementById('item-meta').textContent = `${count} surah${count !== 1 ? 's' : ''}`;
      document.getElementById('item-box').style.display = 'block';
    }

    function countVerses(node) {
      return (node.verses || []).length + (node.children || []).reduce((a, c) => a + countVerses(c), 0);
    }
  </script>
</body>
</html>
